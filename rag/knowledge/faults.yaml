# Fault terms bridging mock-data codes F01–F14 to manual wording.
# The manuals never contain the codes; "match" drives query-topic detection
# (kept specific: bare "цепь" would false-trigger F14, so it is not here).
# "queries" are manual-terminology formulations added to the search.
# Verified against plan-B section 14 (draft) — refine after eval runs.
version: 1
faults:
  F01:
    title: Клапанный механизм
    queries:
      - тепловые зазоры клапанов
      - регулировка клапанного механизма
      - зазор между клапаном и коромыслом
      - штанги толкателей и коромысла
    match: [клапан, клапанный механизм, тепловой зазор, коромысло, штанга толкателя, гидротолкател]
  F02:
    title: Низкое давление масла
    queries:
      - давление масла ниже допустимого
      - клапан редукционный масляного насоса
      - сигнализатор аварийного давления масла
      - вкладыши коренных подшипников
    match: [давление масла, масляный насос, редукционный клапан, аварийного давления масла]
  F03:
    title: Перегрев, охлаждающая жидкость в масле
    queries:
      - температура охлаждающей жидкости выше нормы
      - водяной насос и термостат
      - попадание охлаждающей жидкости в систему смазки
      - пробита прокладка головки цилиндров
    match: [перегрев, охлаждающая жидкость, термостат, водяной насос, прокладка головки]
  F04:
    title: Ремённый привод агрегатов
    queries:
      - натяжение ремней привода агрегатов
      - ремень привода генератора и водяного насоса
      - натяжной ролик ремня
    match: [ремень, ременный привод, натяжение ремня, натяжной ролик, привод агрегатов]
  F05:
    title: Генератор
    queries:
      - шум или стук в генераторе
      - подшипник генератора
      - амперметр показывает разрядный ток
      - регулятор напряжения
    match: [генератор, амперметр, разрядный ток, регулятор напряжения]
  F06:
    title: Сцепление
    queries:
      - сцепление ведомый и нажимной диски
      - свободный ход педали сцепления
      - муфта выключения сцепления
      - оттяжные рычаги сцепления
    match: [сцепление, ведомый диск, нажимной диск, педаль сцепления, картер сцепления]
  F07:
    title: Коробка передач
    queries:
      - шум в коробке передач
      - самопроизвольное выключение передачи
      - затрудненное включение передач
    match: [коробка передач, передача, коробк]
  F08:
    title: Дизельная топливоподача
    queries:
      - топливный насос высокого давления
      - угол опережения впрыскивания топлива
      - форсунки дизельного двигателя
    match: [тнвд, топливный насос высокого давления, топливоподача, впрыскиван, форсунк]
  F09:
    title: Турбокомпрессор, наддув
    queries:
      - турбокомпрессор и давление наддува
      - масло из турбокомпрессора
    match: [турбокомпрессор, турбина, наддув]
  F10:
    title: Компрессор пневмотормозов, насос ГУР
    queries:
      - компрессор пневматических тормозов
      - производительность компрессора
      - насос гидроусилителя руля
    match: [компрессор, пневмотормоз, гидроусилител, насос гур]
  F11:
    title: Рециркуляция отработавших газов
    queries:
      - рециркуляция отработавших газов
      - клапан системы рециркуляции
    match: [рециркуляц, огн, клапан egr, egr]
  F12:
    title: Зажигание
    queries:
      - свечи зажигания
      - катушка зажигания
      - пропуски воспламенения
    match: [зажигание, свеч, катушка зажигания, воспламенен, искра]
  F13:
    title: Подача бензина
    queries:
      - бензонасос и давление топлива
      - карбюратор
    match: [бензонасос, электробензонасос, карбюратор, подача бензина, поплавковая камера]
  F14:
    title: Цепь ГРМ, гидронатяжитель
    queries:
      - цепь привода распределительных валов
      - гидронатяжитель цепи
      - фазы газораспределения
    match: [цепь грм, гидронатяжител, цепь привода распределител, фаз газораспределен, успокоитель цепи]
