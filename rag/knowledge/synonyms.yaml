# Mechanic slang → manual terminology; applied to every query.
# From architecture-B section 4.6.
version: 1
synonyms:
  - { slang: [башка, голова], term: головка блока цилиндров }
  - { slang: [помпа], term: водяной насос }
  - { slang: [коленвал, кв], term: коленчатый вал }
  - { slang: [грм], term: газораспределительный механизм }
  - { slang: [ткр, турбина], term: турбокомпрессор }
  - { slang: [тнвд], term: топливный насос высокого давления }
  - { slang: [сальник], term: манжета уплотнительная }
  - { slang: [холостые, хх], term: холостой ход }
  - { slang: [вкладыши], term: подшипники скольжения }
  - { slang: [распредвал], term: распределительный вал }
  - { slang: [бензонасос], term: топливный насос }
  # «Прогиб ремня» (вопрос механика) против «натяжение ремней» (заголовок
  # раздела и текст «должны прогибаться на 10-15 мм»): без связки запрос
  # по прогибу отвечает таблицей неисправностей (golden g06).
  - { slang: [прогиб, прогибаться, стрела прогиба], term: натяжение ремня }

# «Затягиваются / крутят» (проза раздела сборки) против «Моменты затяжки»
# (заголовки приложений-таблиц нормативов): моментным запросам добавляется
# табличная формулировка, иначе нарратив сборки перекрывает appendix
# (golden g10). Не в faults.yaml — момент не тема неисправности и не должен
# участвовать в детекте и отказе по покрытию.
moment:
  match: [затягиваются, затянуть, затяжк, крутит, тянуть]
  queries:
    - момент затяжки
